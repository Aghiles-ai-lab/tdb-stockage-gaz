name: Actualisation quotidienne AGSI+

on:
  schedule:
    - cron: "0 12 * * *" # Tous les jours à 12h00 UTC (13h hiver / 14h été)
  workflow_dispatch:     # Permet un lancement manuel à tout moment

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install pandas pyarrow numpy requests

      - name: Mettre à jour les données et générer index.html
        env:
          AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
        run: python update_data.py

      - name: Sauvegarder les nouveaux fichiers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agsi_cache.parquet dashboard_data.json index.html
          git diff --staged --quiet || git commit -m "Mise à jour AGSI+ $(date +'%Y-%m-%d')"
          git push
