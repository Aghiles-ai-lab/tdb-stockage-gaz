name: Actualisation quotidienne AGSI+

on:
  schedule:
    - cron: "15 12 * * *" # Tous les jours vers 13h15 (hiver) / 14h15 (été)
  workflow_dispatch:       # Permet aussi un lancement manuel à tout moment

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agsi-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install pandas pyarrow numpy requests

      - name: Mettre à jour les données et générer index.html
        env:
          AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
        run: python update_data.py

      - name: Sauvegarder les nouveaux fichiers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agsi_cache.parquet dashboard_data.json index.html
          if ! git diff --staged --quiet; then
            git commit -m "Mise à jour AGSI+ $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi

      - name: Préparer la page web
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Transférer vers GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
